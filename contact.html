<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get in Touch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans">
  <section class="bg-slate-900 text-white py-12 px-6">
    <div class="max-w-6xl mx-auto flex flex-col lg:flex-row items-center">
      <div class="w-full lg:w-1/2 mb-8 lg:mb-0">
        <h2 class="text-3xl font-semibold mb-4">Get in touch</h2>
        <p>We're eager to support and answer any questions you have. Reach out via phone or online chat.</p>
      </div>
      <div class="w-full lg:w-1/2">
        <img src="https://cdn.prod.website-files.com/603f5d1df4ee236b69719ff2/65e833eda4d0a90120ab74c3_65434f0d454d4544422a479d.webp" alt="Support Representative" class="rounded-lg shadow-lg" />
      </div>
    </div>
  </section>

  <section class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 py-12 px-6">
    <!-- Talk to Sales -->
    <div class="p-6 border rounded-lg shadow-md">
      <div class="flex items-center mb-4">
        <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 5h2l3.6 7.59-1.35 2.44c-.16.28-.25.61-.25.97 0 1.1.9 2 2 2h12v-2H9.42c-.14 0-.25-.11-.25-.25l.03-.12L10.1 13h7.45c.75 0 1.41-.41 1.75-1.03L23 6H6.21"></path>
        </svg>
        <h3 class="text-xl font-semibold">Talk to Sales</h3>
      </div>
      <p class="mb-4">GET YOUR QUERIES RESOLVED!</p>
      <a href="#" class="text-blue-600 font-semibold hover:underline">+1 877 929 0687</a><br />
      <a href="#" class="text-sm text-blue-400 hover:underline">See our global numbers</a>
    </div>

    <!-- Contact Customer Support -->
    <div class="p-6 border rounded-lg shadow-md">
      <div class="flex items-center mb-4">
        <svg class="w-6 h-6 mr-2 text-orange-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18.364 5.636a9 9 0 1 0 0 12.728 9 9 0 0 0 0-12.728z"></path>
          <path d="M12 7v5l3 3"></path>
        </svg>
        <h3 class="text-xl font-semibold">Contact Customer Support</h3>
      </div>
      <p class="mb-4">Get help with our VirtuNest AR/VR services.</p>
      <button class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">Contact Support</button>
    </div>
  </section>
</body>
</html>
